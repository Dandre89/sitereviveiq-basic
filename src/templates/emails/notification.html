{% extends "emails/base_email.html" %}
{% block subject %}SiteRevive IQ: {{ title }}{% endblock %}
{% block content %}
<h1 style="margin:0 0 16px 0; font-size:20px; line-height:1.3; color:#0F172A;">{{ title }}</h1>

<p style="margin:0 0 20px 0; font-size:15px; line-height:1.6; color:#334155;">
{{ message|linebreaksbr }}
</p>

<table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 8px 0;">
<tr>
<td style="border-radius:8px; background-color:#0090FF; background-image:linear-gradient(135deg, #0090FF 0%, #00C9E8 100%);">
<a href="{{ notifications_url }}" style="display:inline-block; padding:12px 24px; font-size:14px; font-weight:600; color:#FFFFFF; text-decoration:none;">View in SiteRevive IQ</a>
</td>
</tr>
</table>

<p style="margin:24px 0 0 0; font-size:13px; line-height:1.6; color:#64748B;">
You can adjust which of these emails you get from Settings &rarr; Notifications.
</p>
{% endblock %}
