{% extends "base.html" %}
{% load cachebust %}
{% block title %}Password updated — SiteRevive IQ{% endblock %}
{% block content %}
<div class="flex items-center justify-center" style="min-height: 80vh;">
    <div class="w-full max-w-sm text-center">
        <img src="{% static_v 'img/logo-mark-96.png' %}" alt="SiteRevive IQ" class="mx-auto mb-4" style="width:44px;height:44px;border-radius:12px;object-fit:cover;">
        <h1 class="text-xl font-medium tracking-tight mb-2">Password updated</h1>
        <p class="text-sm text-muted mb-5">You can now log in with your new password.</p>
        <a href="{% url 'accounts:login' %}" class="btn-primary py-2.5 px-5 text-sm inline-block">Log in</a>
    </div>
</div>
{% endblock %}
