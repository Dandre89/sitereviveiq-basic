[project]
name = "sitereviveiq"
version = "0.1.0"
description = "SiteRevive IQ - website intelligence and renovation engine (Build 1: foundation + secure crawler)"
requires-python = ">=3.12"
dependencies = [
    "django==5.2.*",
    "psycopg[binary]==3.2.*",
    "celery==5.4.*",
    "redis==5.0.*",
    "httpx==0.27.*",
    "selectolax==0.3.*",
    "gunicorn==22.0.*",
    "django-htmx==1.19.*",
    "python-dotenv==1.0.*",
    "whitenoise==6.7.*",
    "xhtml2pdf==0.2.*",
    "Pillow==12.3.*",
    "stripe==15.*",
    "django-ratelimit==4.1.*",
    "django-redis==5.4.*",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.*",
    "pytest-django==4.8.*",
    "pytest-celery==0.0.0; python_version >= '3.12'",
    "factory-boy==3.3.*",
    "ruff==0.5.*",
    "respx==0.21.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = ["src"]
